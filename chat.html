<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EO Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/lib/webllm.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; color: #e94560; }
    .header .status { font-size: 12px; color: #888; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: #0f3460; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #1a1a2e; border: 1px solid #333; }
    .msg.system { align-self: center; background: none; color: #888; font-size: 12px; font-style: italic; }
    .input-area { padding: 12px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
    .input-area textarea { flex: 1; background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; resize: none; font-family: inherit; font-size: 14px; min-height: 40px; max-height: 120px; }
    .input-area textarea:focus { outline: none; border-color: #e94560; }
    .input-area button { background: #e94560; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    .input-area button:hover { background: #c73550; }
    .input-area button:disabled { background: #555; cursor: not-allowed; }
    .toolbar { padding: 8px 20px; background: #0f1525; border-top: 1px solid #333; display: flex; gap: 12px; align-items: center; font-size: 12px; color: #888; }
    .toolbar label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .toolbar select { background: #1a1a2e; border: 1px solid #333; color: #e0e0e0; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
    .toolbar button { background: none; border: 1px solid #555; color: #aaa; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .toolbar button:hover { border-color: #e94560; color: #e94560; }
    .toolbar .stats { margin-left: auto; }
    .progress { display: none; padding: 8px 20px; background: #0a0a1a; border-top: 1px solid #333; font-size: 12px; color: #888; }
    .progress.active { display: block; }
    .progress .bar { height: 4px; background: #333; border-radius: 2px; margin-top: 4px; overflow: hidden; }
    .progress .bar .fill { height: 100%; background: #e94560; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="header">
    <h1>EO Chat</h1>
    <span class="status" id="engineStatus">Engine: loading...</span>
  </div>

  <div class="messages" id="messages">
    <div class="msg system">WebLLM loading in browser. No server needed.</div>
  </div>

  <div class="input-area">
    <textarea id="userInput" placeholder="Type a message... (Shift+Enter for newline)" rows="1"></textarea>
    <button id="sendBtn" onclick="handleSend()">Send</button>
  </div>

  <div class="toolbar">
    <label>Model:
      <select id="modelSelect" onchange="switchModel()">
        <option value="Qwen/Qwen2.5-1.5B-Instruct">Qwen2.5 1.5B (fast)</option>
        <option value="Qwen/Qwen2.5-3B-Instruct">Qwen2.5 3B (balanced)</option>
        <option value="Qwen/Qwen2.5-Coder-3B-Instruct">Qwen2.5 Coder 3B (coding)</option>
      </select>
    </label>
    <button onclick="clearChat()">Clear</button>
    <span class="stats" id="stats">Messages: 0</span>
  </div>

  <div class="progress" id="progress">
    <span id="progressText">Loading model...</span>
    <div class="bar"><div class="fill" id="progressFill"></div></div>
  </div>

<script>
let engine = null;
let isProcessing = false;
let messageCount = 0;
let conversationHistory = [];

// ── WebLLM Engine ──

async function loadModel(modelId) {
  const progress = document.getElementById("progress");
  const progressText = document.getElementById("progressText");
  const progressFill = document.getElementById("progressFill");
  
  progress.classList.add("active");
  progressText.textContent = `Loading ${modelId}...`;
  progressFill.style.width = "0%";
  
  try {
    engine = await webllm.CreateEngine(modelId, {
      progressCallback: (report) => {
        if (report.progress) {
          const pct = Math.round(report.progress * 100);
          progressFill.style.width = pct + "%";
          progressText.textContent = `Loading ${modelId}: ${pct}%`;
        }
      }
    });
    
    progress.classList.remove("active");
    document.getElementById("engineStatus").textContent = `Engine: ready (${modelId})`;
    document.getElementById("engineStatus").style.color = "#4caf50";
    return true;
  } catch (e) {
    progressText.textContent = `Error: ${e.message}`;
    progressFill.style.width = "0%";
    document.getElementById("engineStatus").textContent = `Engine: error`;
    document.getElementById("engineStatus").style.color = "#f44336";
    return false;
  }
}

async function switchModel() {
  const modelId = document.getElementById("modelSelect").value;
  await loadModel(modelId);
}

// ── Chat ──

async function handleSend() {
  if (isProcessing || !engine) return;
  const input = document.getElementById("userInput");
  const userText = input.value.trim();
  if (!userText) return;

  input.value = "";
  input.style.height = "40px";
  isProcessing = true;
  document.getElementById("sendBtn").disabled = true;

  appendMessage(userText, "user");
  conversationHistory.push({ role: "user", content: userText });

  try {
    const response = await engine.chat.completions.create({
      messages: conversationHistory,
      temperature: 0.7,
      max_tokens: 2048
    });
    
    const content = response.choices[0]?.message?.content || "";
    appendMessage(content, "assistant");
    conversationHistory.push({ role: "assistant", content });
  } catch (e) {
    appendMessage(`[Error: ${e.message}]`, "system");
  }

  isProcessing = false;
  document.getElementById("sendBtn").disabled = false;
  input.focus();
}

// ── UI ──

function appendMessage(text, role) {
  const messages = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  messageCount++;
  document.getElementById("stats").textContent = `Messages: ${messageCount}`;
}

function clearChat() {
  document.getElementById("messages").innerHTML = "";
  conversationHistory = [];
  messageCount = 0;
  document.getElementById("stats").textContent = "Messages: 0";
}

function autoResize(textarea) {
  textarea.style.height = "40px";
  textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";
}

// ── Init ──

async function init() {
  const input = document.getElementById("userInput");
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  input.addEventListener("input", () => autoResize(input));
  
  await loadModel(document.getElementById("modelSelect").value);
  input.focus();
}

init();
</script>
</body>
</html>
